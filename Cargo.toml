[package]
name = "rust_zero_copy_event_stream"
version = "1.0.0"
edition = "2021"
authors = ["Felipe Madison <160553421+FelipeMadson@users.noreply.github.com>"]
description = "High-throughput circular ring buffer event streaming engine with zero memory allocations, batch flushing, and binary serialization in Rust"
license = "MIT"
repository = "https://github.com/FelipeMadson/rust-zero-copy-event-stream"
readme = "README.md"

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
